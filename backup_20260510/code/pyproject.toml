[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slam_sweep"
version = "0.1.0"
description = "Weights & Biases sweep orchestration for GLIM SLAM parameter tuning."
requires-python = ">=3.10"
dependencies = [
    "wandb>=0.16",
    "numpy>=1.24",
    "click>=8.1",
]

[project.optional-dependencies]
# Only needed for `slam-sweep export-ply`; the sweep itself does not use it.
ply = ["open3d>=0.18"]

[project.scripts]
slam-sweep = "slam_sweep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slam_sweep*"]
